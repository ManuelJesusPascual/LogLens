spring.application.name=loglens
server.port=8080

spring.datasource.url=jdbc:sqlite:./loglens.db
spring.datasource.driver-class-name=org.sqlite.JDBC

spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:initial.sql

spring.datasource.hikari.maximum-pool-size=1

loglens.admin.password=${ADMIN_PASSWORD}
